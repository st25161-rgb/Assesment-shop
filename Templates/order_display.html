{% extends "base.html" %}

{% block title %} About - About Us {% endblock %}

{% block content %}
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <title>Order History</title>
    </head>
    <div class="margin">
        <header>
            <h1 id="mainhead" >Order History</h1>
        </header>
        {% if orders %}
            <table>
                <thead>
                    <tr>
                        <th>Invoice Number</th>
                        <th>Customer Name</th>
                        <th>Pizzas</th>
                        <th>Drinks</th>
                        <th>Total</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    {% for orders in orders %}
                        <tr>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <form action="{{ url_for('cancel_saved_order', order_id=order.order_id) }}" method="post">
                                <button type="submit" id="submit" onclick="return confirm('Are you sure you want to cancel this order?');">Cancel Order</button>
                            </form>
                        </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p> No past orders found. </p>
        {% endif %}
    </div>
{% endblock %}
